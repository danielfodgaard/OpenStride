services:
  openstride:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the container it must listen on all interfaces to be reachable at all.
      # The only published port is on the host's loopback, so the server is not open.
      OPENSTRIDE_HOST: 0.0.0.0
      OPENSTRIDE_ALLOW_OPEN: "1"
      OPENSTRIDE_PORT: "8000"
      OPENSTRIDE_DATA_DIR: /app/data
      # "Today" is the container's local date. Set your time zone, or a late-evening run lands on tomorrow.
      # TZ: Europe/Copenhagen
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    # The OS sandbox for the agents' shells is off in a default container: Docker's syscall filter stops it.
    # Turn it on in a file named compose.override.yaml beside this one (this file is reset on every deploy):
    #
    #   services:
    #     openstride:
    #       security_opt:
    #         - seccomp=unconfined
    #
    # `docker compose exec openstride openstride doctor` then says "sandbox: on". docs/SETUP.md has the details.
    # For the tailscale sidecar below: delete `ports:` and uncomment this line.
    # network_mode: service:tailscale

  # Optional: join the tailnet from here, for a server without Tailscale on the host.
  # Put TS_AUTHKEY=tskey-auth-... in .env (admin console, Settings, Keys), then uncomment.
  # scripts/tailscale/serve.json sends https://openstride.<tailnet>.ts.net to port 8000.
  # tailscale:
  #   image: tailscale/tailscale:stable
  #   hostname: openstride
  #   restart: unless-stopped
  #   environment:
  #     TS_AUTHKEY: ${TS_AUTHKEY}
  #     TS_HOSTNAME: openstride
  #     TS_STATE_DIR: /var/lib/tailscale
  #     TS_SERVE_CONFIG: /config/serve.json
  #   volumes:
  #     - tailscale-state:/var/lib/tailscale   # node keys: kept out of ./data and its backups
  #     - ./scripts/tailscale:/config:ro   # a directory: Tailscale requires that, not a single file

# Uncomment with the tailscale service.
# volumes:
#   tailscale-state:
