<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>OpenStride</title>
<meta name="theme-color" content="#f4f6f7">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OpenStride">
<script>
// Before first paint, so a stored theme never flashes the other one.
try { const t = localStorage.getItem("openstride:theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<header class="appbar">
  <span class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M62 30 H35 A20 20 0 0 0 35 70 H65 A20 20 0 0 0 85 50" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="35" r="7" fill="#E8501A"/></svg>OpenStride</span>
  <span class="appbar-actions">
    <button type="button" class="quiet" id="plan-button" hidden>Plan</button>
    <button type="button" class="quiet" id="data-button" aria-controls="drawer" aria-expanded="false">Data</button>
    <button type="button" class="quiet" id="theme-toggle"></button>
  </span>
</header>
<div class="offline-banner" id="offline-banner" role="status" hidden></div>
<nav class="glance" id="glance" aria-label="At a glance"></nav>
<div class="layout">
  <main class="stream" id="stream">
    <button type="button" class="quiet earlier" id="earlier" hidden>Earlier</button>
    <div id="events" class="events" role="log" aria-live="polite"></div>
    <div id="live" class="live" hidden></div>
  </main>
  <aside class="drawer" id="drawer" aria-label="Your data" hidden></aside>
</div>
<form class="composer" id="composer">
  <div class="attachments" id="attachments" hidden></div>
  <div class="composer-row">
    <button type="button" class="quiet icon" id="attach" aria-label="Attach a file" title="Attach a file: a .fit or .gpx recording, a photo, a screenshot">＋</button>
    <input type="file" id="file-input" multiple hidden>
    <textarea id="message" rows="1" placeholder="Ask, tell or change anything" aria-label="Message to your coach" enterkeyhint="send"></textarea>
    <button type="submit" class="primary" id="send">Send</button>
    <button type="button" class="danger" id="stop" hidden>Stop</button>
  </div>
</form>
<dialog class="sheet wide" id="peek"></dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
