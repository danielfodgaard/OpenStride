[project]
name = "openstride"
version = "4.0.0"
description = "An open-source running coach"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "anthropic",
    "python-dotenv",
    "fitdecode",
    "gpxpy",
    "python-multipart",
    "filelock",
    # Pinned with its dependencies: its token reaches a whole Garmin account, so upgrade on purpose.
    "garminconnect==0.3.20",
    "curl-cffi==0.17.0",
    "ua-generator==2.1.7",
    "requests==2.34.2",
    "garmin-connect-personal-api-python>=1,<2",
]

[project.scripts]
openstride = "app.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
