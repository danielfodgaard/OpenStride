[project]
name = "openstride"
version = "4.0.0"
description = "An open-source running coach"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "anthropic",
    "python-dotenv",
    "fitdecode",
    "gpxpy",
    "python-multipart",
    "filelock",
]

[project.scripts]
openstride = "app.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
