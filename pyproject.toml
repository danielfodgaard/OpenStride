[project]
name = "openstride"
version = "0.2.0"
description = "An open-source running coach: an agent on top of your training data"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "python-dotenv",
    "python-multipart",
    "httpx",
    "pyyaml",
    "claude-agent-sdk>=0.2.180",
]

[project.optional-dependencies]
# What the analyst computes with, inside its sandbox.
analyst = ["pandas", "numpy", "scipy", "matplotlib"]

[project.scripts]
openstride = "app.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
